name: Materialize developer handoff

on:
  push:
    branches: [main]
    paths:
      - ".handoff/**"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize handoff package
        if: ${{ hashFiles('.handoff/archive.part-*') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cat .handoff/archive.part-* > /tmp/math-tutor-handoff.b64
          base64 --decode /tmp/math-tutor-handoff.b64 > /tmp/math-tutor-handoff.tar.gz
          tar -xzf /tmp/math-tutor-handoff.tar.gz -C .
          rm -rf .handoff

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Materialize developer handoff package"
          git push
